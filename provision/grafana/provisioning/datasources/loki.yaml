apiVersion: 1

deleteDatasources:
  - name: Loki
    orgId: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: true
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '(?:"trace_id"\s*:\s*"|trace_id[=:]\s*"?)([a-f0-9]{32})'
          datasourceUid: tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View trace
