apiVersion: 1

contactPoints:
  - orgId: 1
    name: disk-email
    receivers:
      - uid: disk-email
        type: email
        settings:
          addresses: $GRAFANA_ALERT_EMAIL

policies:
  - orgId: 1
    receiver: disk-email
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: host-disk
    folder: Infrastructure
    interval: 1m
    rules:
      - uid: root-filesystem-usage
        title: Root filesystem usage above 85%
        condition: B
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: Root filesystem usage is above 85%
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: '100 * (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    params: [85]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                  type: query
              refId: B
