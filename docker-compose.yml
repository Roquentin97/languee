services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANGUEE_BACK_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LANGUEE_BACK_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LANGUEE_BACK_POSTGRES_DB}
    ports:
      - "${LANGUEE_BACK_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${LANGUEE_BACK_POSTGRES_USER} -d ${LANGUEE_BACK_POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${LANGUEE_BACK_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGUEE_BACK_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: ./apps/languee-back
      dockerfile: Dockerfile
      target: builder
    profiles:
      - tools
    env_file:
      - ./apps/languee-back/.env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./apps/languee-back
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - ./apps/languee-back/.env
    ports:
      - "${LANGUEE_BACK_API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
