version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/languee-back"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/apps/languee-nlp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gradle"
    directory: "/apps/languee-droid"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # These androidx releases require compileSdk 37; the app is on compileSdk 36.
      # Remove these entries when compileSdk is raised (dedicated migration PR).
      - dependency-name: "androidx.core:core-ktx"
        versions: ["[1.19,)"]
      - dependency-name: "androidx.lifecycle:*"
        versions: ["[2.11,)"]
      - dependency-name: "androidx.hilt:hilt-navigation-compose"
        versions: ["[1.4,)"]
      # ktlint plugin >=13 wires up source sets the 12.x config never linted,
      # forcing a codebase-wide reformat plus manual fixes - a separate scoped
      # cleanup task, not a version bump. Remove after that cleanup lands.
      - dependency-name: "org.jlleitschuh.gradle.ktlint"
        versions: ["[13,)"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/apps/languee-back"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Node runtime majors are deliberate migrations (image + CI node-version +
      # engines move in lockstep), and dependabot proposes non-LTS odd majors
      # (25, then 23 after 25 was ignored). Remove when planning the Node 24 LTS move.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/apps/languee-nlp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      all-actions:
        applies-to: version-updates
        update-types:
          - "major"
          - "minor"
          - "patch"
    ignore:
      # gradle/actions v6 bundles a proprietary (non-MIT) caching component whose
      # Terms of Use are accepted implicitly on upgrade. Held at v5 (last fully
      # MIT line) until a human decides on the v6 licensing. Remove this to allow.
      - dependency-name: "gradle/actions"
        update-types: ["version-update:semver-major"]
