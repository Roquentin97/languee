name: Deploy (dev)

# Deploys to the Oracle dev VM only after a merge into `develop`: the trigger is
# the resulting push, built from that exact commit (github.sha). Unmerged PR
# code never reaches this workflow. develop is PR-only (branch ruleset), so a
# push is a merge; Release Please only opens PRs and never pushes to develop.
#
# workflow_dispatch from develop re-runs the pipeline for the branch head, or
# with `tag` rolls back to an image built from an earlier develop commit.
on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      tag:
        description: Existing sha-<commit> image tag to deploy without rebuilding (rollback). Leave empty to build and deploy the develop head.
        required: false
        type: string

# Serialize deploys. A run waiting behind an active one is replaced by newer
# runs, and `resolve` skips any run whose commit is no longer the develop head.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/roquentin97/languee

jobs:
  resolve:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
      stale: ${{ steps.tag.outputs.stale }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          stale=false
          if [ -n "$INPUT_TAG" ]; then
            if ! [[ "$INPUT_TAG" =~ ^sha-[0-9a-f]{7,40}$ ]]; then
              echo "tag must look like sha-<commit>" >&2; exit 1
            fi
            commit="${INPUT_TAG#sha-}"
            if ! git merge-base --is-ancestor "$commit" origin/develop; then
              echo "$INPUT_TAG was not built from a commit on develop" >&2; exit 1
            fi
            tag="$INPUT_TAG"; build=false
          else
            tag="sha-${GITHUB_SHA::7}"; build=true
            head=$(git rev-parse origin/develop)
            if [ "$head" != "$GITHUB_SHA" ]; then
              echo "::notice::$GITHUB_SHA is no longer the develop head; skipping stale deploy"
              stale=true
            fi
          fi
          {
            echo "tag=$tag"
            echo "build=$build"
            echo "stale=$stale"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true' && needs.resolve.outputs.stale != 'true'
    # Native ARM64 runner: the Oracle Ampere host is the only target, no emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: languee-back
            context: apps/languee-back
            target: production
          - name: languee-back-migrator
            context: apps/languee-back
            target: migrator
          - name: languee-nlp
            context: apps/languee-nlp
            target: production
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ needs.resolve.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    needs: [resolve, build]
    # Build succeeded, or was skipped for a rollback. A stale run deploys nothing.
    if: >-
      always() && needs.resolve.result == 'success'
      && needs.resolve.outputs.stale != 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment: languee-dev
    steps:
      - uses: actions/checkout@v7
      - name: Copy compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/languee/
      - name: Copy deploy assets
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/caddy/Caddyfile,deploy/scripts/backup-db.sh,deploy/scripts/deploy-stack.sh,deploy/scripts/sync-vault-config.py
          target: /opt/languee/
          strip_components: 1
      - name: Apply Vault config, migrate, restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_TAG: ${{ needs.resolve.outputs.tag }}
          VAULT_SECRET_OCID: ${{ vars.VAULT_SECRET_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_TAG,VAULT_SECRET_OCID,OCI_REGION
          script_stop: true
          script: |
            chmod +x /opt/languee/scripts/backup-db.sh /opt/languee/scripts/deploy-stack.sh
            /opt/languee/scripts/deploy-stack.sh --tag "$DEPLOY_TAG"
      - name: Public readiness check
        env:
          HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "DEPLOY_HEALTHCHECK_URL not set; skipping public check"
            exit 0
          fi
          curl -fsS -o /dev/null --max-time 15 --retry 10 --retry-delay 6 --retry-all-errors "$HEALTHCHECK_URL"
