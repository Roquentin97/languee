name: Deploy (dev)

# Build identities are workflow-attempt derived; this workflow never creates a
# release, tag, changelog, or moving application image tag.
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      rollback_back_tag:
        description: Existing backend dev-* artifact to restore (optional)
        required: false
        type: string
      rollback_nlp_tag:
        description: Existing NLP dev-* artifact to restore (optional)
        required: false
        type: string
      force_deploy:
        description: Build both current services even without a detected source change
        required: false
        default: false
        type: boolean
      allow_persistent_infra:
        description: Confirm backup and compatibility review for a PostgreSQL/Redis image update
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/roquentin97/languee

jobs:
  resolve:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      back: ${{ steps.resolve.outputs.back }}
      nlp: ${{ steps.resolve.outputs.nlp }}
      config: ${{ steps.resolve.outputs.config }}
      infra: ${{ steps.resolve.outputs.infra }}
      deploy: ${{ steps.resolve.outputs.deploy }}
      stale: ${{ steps.resolve.outputs.stale }}
      rollback: ${{ steps.resolve.outputs.rollback }}
      patch: ${{ steps.resolve.outputs.patch }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          ROLLBACK_BACK: ${{ inputs.rollback_back_tag }}
          ROLLBACK_NLP: ${{ inputs.rollback_nlp_tag }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_RUN_ATTEMPT}" -ge 1000 ]; then
            echo "github.run_attempt must be less than 1000" >&2
            exit 1
          fi
          patch=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          sha12=${GITHUB_SHA:0:12}
          tag="dev-${patch}-${sha12}"
          version="0.0.${patch}"
          rollback=false
          stale=false
          printf '' > changed-files

          if [ "$EVENT_NAME" = workflow_dispatch ] && { [ -n "$ROLLBACK_BACK" ] || [ -n "$ROLLBACK_NLP" ]; }; then
            rollback=true
            for artifact in "$ROLLBACK_BACK" "$ROLLBACK_NLP"; do
              if [ -n "$artifact" ] && ! [[ "$artifact" =~ ^dev-[0-9]+-[0-9a-f]{12}$ ]]; then
                echo "rollback tags must use dev-<patch>-<12-character-sha>" >&2
                exit 1
              fi
            done
            back=false; nlp=false; config=false; infra=''
            [ -n "$ROLLBACK_BACK" ] && back=true
            [ -n "$ROLLBACK_NLP" ] && nlp=true
            deploy=true
          else
            conservative=false
            manual=false
            if [ "$EVENT_NAME" = workflow_dispatch ]; then
              manual=true
            elif [ -z "$PUSH_BEFORE" ] || [[ "$PUSH_BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
              conservative=true
            else
              git diff --name-only "$PUSH_BEFORE" "$GITHUB_SHA" > changed-files
            fi
            if [ "$FORCE_DEPLOY" = true ]; then manual=true; fi
            flags=()
            [ "$conservative" = true ] && flags+=(--conservative)
            [ "$manual" = true ] && flags+=(--manual)
            decision=$(python3 deploy/scripts/classify-deploy-changes.py --files changed-files "${flags[@]}")
            back=$(jq -r .back <<<"$decision")
            nlp=$(jq -r .nlp <<<"$decision")
            config=$(jq -r .config <<<"$decision")
            deploy=$(jq -r .relevant <<<"$decision")
            infra=''
            if [ "$conservative" = false ] && git diff --unified=0 "$PUSH_BEFORE" "$GITHUB_SHA" -- docker-compose.prod.yml | grep -Eq '^[+-][[:space:]]*image:[[:space:]]*postgres:'; then infra="$infra postgres"; fi
            if [ "$conservative" = false ] && git diff --unified=0 "$PUSH_BEFORE" "$GITHUB_SHA" -- docker-compose.prod.yml | grep -Eq '^[+-][[:space:]]*image:[[:space:]]*redis:'; then infra="$infra redis"; fi
            if [ "$conservative" = false ] && git diff --unified=0 "$PUSH_BEFORE" "$GITHUB_SHA" -- docker-compose.prod.yml | grep -Eq '^[+-][[:space:]]*image:[[:space:]]*caddy:'; then infra="$infra caddy"; fi
            [ -n "$infra" ] && deploy=true
            head=$(git rev-parse origin/develop)
            if [ "$head" != "$GITHUB_SHA" ]; then
              echo "::notice::$GITHUB_SHA is no longer the develop head; skipping stale deploy"
              stale=true
            fi
          fi
          {
            echo "back=$back"
            echo "nlp=$nlp"
            echo "config=$config"
            echo "infra=${infra# }"
            echo "deploy=$deploy"
            echo "stale=$stale"
            echo "rollback=$rollback"
            echo "patch=$patch"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  build-back:
    needs: resolve
    if: needs.resolve.outputs.back == 'true' && needs.resolve.outputs.rollback != 'true' && needs.resolve.outputs.stale != 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: languee-back
            target: production
          - name: languee-back-migrator
            target: migrator
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ needs.resolve.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then echo "value=true" >> "$GITHUB_OUTPUT"; else echo "value=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v7
        if: steps.exists.outputs.value != 'true'
        with:
          context: apps/languee-back
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ needs.resolve.outputs.tag }}
          build-args: |
            APP_VERSION=${{ needs.resolve.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.build-id=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  build-nlp:
    needs: resolve
    if: needs.resolve.outputs.nlp == 'true' && needs.resolve.outputs.rollback != 'true' && needs.resolve.outputs.stale != 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: exists
        env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/languee-nlp:${{ needs.resolve.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then echo "value=true" >> "$GITHUB_OUTPUT"; else echo "value=false" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v7
        if: steps.exists.outputs.value != 'true'
        with:
          context: apps/languee-nlp
          target: production
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/languee-nlp:${{ needs.resolve.outputs.tag }}
          build-args: |
            APP_VERSION=${{ needs.resolve.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_ID=${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.build-id=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=languee-nlp
          cache-to: type=gha,scope=languee-nlp,mode=max

  deploy:
    needs: [resolve, build-back, build-nlp]
    if: >-
      always() && needs.resolve.result == 'success' && needs.resolve.outputs.deploy == 'true'
      && needs.resolve.outputs.stale != 'true'
      && (needs.build-back.result == 'success' || needs.build-back.result == 'skipped')
      && (needs.build-nlp.result == 'success' || needs.build-nlp.result == 'skipped')
    runs-on: ubuntu-latest
    environment: languee-dev
    steps:
      - uses: actions/checkout@v7
      - name: Copy production Compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/languee/
      - name: Copy deployment scripts and proxy configuration
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/caddy/Caddyfile,deploy/scripts/backup-db.sh,deploy/scripts/deploy-stack.sh,deploy/scripts/sync-vault-config.py
          target: /opt/languee/
          strip_components: 1
      - name: Apply selected artifacts
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_BACK_TAG: ${{ needs.resolve.outputs.rollback == 'true' && inputs.rollback_back_tag || needs.resolve.outputs.back == 'true' && needs.resolve.outputs.tag || '' }}
          DEPLOY_NLP_TAG: ${{ needs.resolve.outputs.rollback == 'true' && inputs.rollback_nlp_tag || needs.resolve.outputs.nlp == 'true' && needs.resolve.outputs.tag || '' }}
          DEPLOY_ROLLBACK: ${{ needs.resolve.outputs.rollback }}
          DEPLOY_INFRA: ${{ needs.resolve.outputs.infra }}
          DEPLOY_CONFIG: ${{ needs.resolve.outputs.config }}
          ALLOW_PERSISTENT_INFRA: ${{ inputs.allow_persistent_infra }}
          VAULT_SECRET_OCID: ${{ vars.VAULT_SECRET_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_BACK_TAG,DEPLOY_NLP_TAG,DEPLOY_ROLLBACK,DEPLOY_INFRA,DEPLOY_CONFIG,ALLOW_PERSISTENT_INFRA,VAULT_SECRET_OCID,OCI_REGION
          script_stop: true
          script: |
            chmod +x /opt/languee/scripts/backup-db.sh /opt/languee/scripts/deploy-stack.sh
            args=()
            if [ -n "$DEPLOY_BACK_TAG" ]; then args+=(--back-tag "$DEPLOY_BACK_TAG"); fi
            if [ -n "$DEPLOY_NLP_TAG" ]; then args+=(--nlp-tag "$DEPLOY_NLP_TAG"); fi
            if [ -z "$DEPLOY_BACK_TAG" ] && [ -z "$DEPLOY_NLP_TAG" ]; then args+=(--preserve-tags); fi
            if [ "$DEPLOY_ROLLBACK" = true ]; then args+=(--rollback); fi
            if [ "$DEPLOY_CONFIG" = true ]; then args+=(--config); fi
            for service in $DEPLOY_INFRA; do args+=(--infra "$service"); done
            if [ "$ALLOW_PERSISTENT_INFRA" = true ]; then args+=(--allow-persistent-infra); fi
            /opt/languee/scripts/deploy-stack.sh "${args[@]}"
      - name: Check public backend readiness
        env:
          DEPLOY_HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HEALTHCHECK_URL" ]; then
            echo "DEPLOY_HEALTHCHECK_URL must be the public /health/ready URL" >&2
            exit 1
          fi
          case "$DEPLOY_HEALTHCHECK_URL" in
            https://*/health/ready) ;;
            *)
              echo "DEPLOY_HEALTHCHECK_URL must be an HTTPS URL ending in /health/ready" >&2
              exit 1
              ;;
          esac
          curl --fail --show-error --silent --max-time 15 --retry 10 --retry-delay 6 \
            --retry-all-errors "$DEPLOY_HEALTHCHECK_URL" > /dev/null
