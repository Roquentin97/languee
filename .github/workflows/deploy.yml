name: Deploy (dev)

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      back_tag:
        description: Existing backend image tag for rollback
        required: false
        type: string
      nlp_tag:
        description: Existing NLP image tag for rollback
        required: false
        type: string
      force_deploy:
        description: Force deployment for docs or otherwise unrelated changes
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/roquentin97/languee

jobs:
  resolve:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      back: ${{ steps.plan.outputs.back }}
      nlp: ${{ steps.plan.outputs.nlp }}
      deploy: ${{ steps.plan.outputs.deploy }}
      stale: ${{ steps.plan.outputs.stale }}
      patch: ${{ steps.plan.outputs.patch }}
      build_id: ${{ steps.plan.outputs.build_id }}
      back_tag: ${{ steps.plan.outputs.back_tag }}
      nlp_tag: ${{ steps.plan.outputs.nlp_tag }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          INPUT_BACK: ${{ inputs.back_tag }}
          INPUT_NLP: ${{ inputs.nlp_tag }}
          FORCE_DEPLOY: ${{ inputs.force_deploy }}
        run: |
          set -euo pipefail
          back=false; nlp=false; deploy=false; stale=false
          if [[ -n "$INPUT_BACK" || -n "$INPUT_NLP" ]]; then
            [[ -z "$INPUT_BACK" || "$INPUT_BACK" =~ ^dev-[0-9]+-[0-9a-f]{12}$ ]]
            [[ -z "$INPUT_NLP" || "$INPUT_NLP" =~ ^dev-[0-9]+-[0-9a-f]{12}$ ]]
            deploy=true
          else
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then
              before="${{ github.event.before }}"
              if [[ "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
                files="*"
              else
                files=$(git diff --name-only "$before" "$GITHUB_SHA")
              fi
              head=$(git rev-parse origin/develop)
              [[ "$head" == "$GITHUB_SHA" ]] || stale=true
            else
              files="*"
            fi
            if [[ "$files" == "*" ]]; then back=true; nlp=true; deploy=true
            else
              while IFS= read -r f; do
                case "$f" in
                  apps/languee-back/*) back=true; deploy=true ;;
                  apps/languee-nlp/*) nlp=true; deploy=true ;;
                  docker-compose.prod.yml|deploy/*|.github/workflows/deploy.yml|.github/workflows/apply-config.yml) deploy=true ;;
                  .github/workflows/*|docker-compose.yml|apps/languee-droid/*|*.md|.claude/*|forge/*) ;;
                  *) back=true; nlp=true; deploy=true ;;
                esac
              done <<< "$files"
            fi
          fi
          [[ "$FORCE_DEPLOY" == true ]] && deploy=true
          patch=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          (( GITHUB_RUN_ATTEMPT < 1000 )) || { echo 'run_attempt must be below 1000' >&2; exit 1; }
          sha="$GITHUB_SHA"; build_id="${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          version="0.1.$patch"; tag="dev-$patch-${GITHUB_SHA:0:12}"
          [[ -z "$INPUT_BACK" ]] || back_tag="$INPUT_BACK"
          [[ -z "$INPUT_NLP" ]] || nlp_tag="$INPUT_NLP"
          {
            echo "back=$back"; echo "nlp=$nlp"; echo "deploy=$deploy"; echo "stale=$stale"
            echo "patch=$patch"; echo "build_id=$build_id"; echo "version=$version"; echo "sha=$sha"
            echo "back_tag=${back_tag:-$tag}"; echo "nlp_tag=${nlp_tag:-$tag}"
          } >> "$GITHUB_OUTPUT"

  build-back:
    needs: resolve
    if: needs.resolve.outputs.back == 'true' && needs.resolve.outputs.stale != 'true' && inputs.back_tag == ''
    runs-on: ubuntu-24.04-arm
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v7
        with:
          context: apps/languee-back
          target: production
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/languee-back:${{ needs.resolve.outputs.back_tag }}
          build-args: |
            APP_VERSION=${{ needs.resolve.outputs.version }}
            GIT_SHA=${{ needs.resolve.outputs.sha }}
            BUILD_ID=${{ needs.resolve.outputs.build_id }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.build.id=${{ needs.resolve.outputs.build_id }}
          cache-from: type=gha,scope=languee-back
          cache-to: type=gha,scope=languee-back,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: apps/languee-back
          target: migrator
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/languee-back-migrator:${{ needs.resolve.outputs.back_tag }}
          build-args: |
            APP_VERSION=${{ needs.resolve.outputs.version }}
            GIT_SHA=${{ needs.resolve.outputs.sha }}
            BUILD_ID=${{ needs.resolve.outputs.build_id }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.build.id=${{ needs.resolve.outputs.build_id }}

  build-nlp:
    needs: resolve
    if: needs.resolve.outputs.nlp == 'true' && needs.resolve.outputs.stale != 'true' && inputs.nlp_tag == ''
    runs-on: ubuntu-24.04-arm
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v7
        with:
          context: apps/languee-nlp
          target: production
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/languee-nlp:${{ needs.resolve.outputs.nlp_tag }}
          build-args: |
            APP_VERSION=${{ needs.resolve.outputs.version }}
            GIT_SHA=${{ needs.resolve.outputs.sha }}
            BUILD_ID=${{ needs.resolve.outputs.build_id }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.build.id=${{ needs.resolve.outputs.build_id }}
          cache-from: type=gha,scope=languee-nlp
          cache-to: type=gha,scope=languee-nlp,mode=max

  deploy:
    needs: [resolve, build-back, build-nlp]
    if: always() && needs.resolve.result == 'success' && needs.resolve.outputs.deploy == 'true' && needs.resolve.outputs.stale != 'true' && (needs.build-back.result == 'success' || needs.build-back.result == 'skipped') && (needs.build-nlp.result == 'success' || needs.build-nlp.result == 'skipped')
    runs-on: ubuntu-latest
    environment: languee-dev
    steps:
      - uses: actions/checkout@v7
      - uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml,deploy/caddy/Caddyfile,deploy/scripts/backup-db.sh,deploy/scripts/deploy-stack.sh,deploy/scripts/sync-vault-config.py
          target: /opt/languee/
      - uses: appleboy/ssh-action@v1.2.5
        env:
          BACK_TAG: ${{ inputs.back_tag != '' && inputs.back_tag || (needs.resolve.outputs.back == 'true' && needs.resolve.outputs.back_tag || '') }}
          NLP_TAG: ${{ inputs.nlp_tag != '' && inputs.nlp_tag || (needs.resolve.outputs.nlp == 'true' && needs.resolve.outputs.nlp_tag || '') }}
          VAULT_SECRET_OCID: ${{ vars.VAULT_SECRET_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: BACK_TAG,NLP_TAG,VAULT_SECRET_OCID,OCI_REGION
          script: |
            chmod +x /opt/languee/scripts/backup-db.sh /opt/languee/scripts/deploy-stack.sh
            args=()
            [ -z "$BACK_TAG" ] || args+=(--back-tag "$BACK_TAG")
            [ -z "$NLP_TAG" ] || args+=(--nlp-tag "$NLP_TAG")
            [ ${#args[@]} -gt 0 ] || args+=(--preserve-tags)
            /opt/languee/scripts/deploy-stack.sh "${args[@]}"
