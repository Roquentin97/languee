name: CI — languee-nlp

on:
  push:
    branches:
      - bb_develop
      - develop
    paths:
      - 'apps/languee-nlp/**'
      - '.github/workflows/ci-languee-nlp.yml'

jobs:
  check:
    name: Format, lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/languee-nlp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Format check
        run: uv run --extra dev ruff format --check .

      - name: Lint
        run: uv run --extra dev ruff check .

      - name: Install spaCy model
        run: uv pip install "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl"

      - name: Tests
        run: uv run --no-sync pytest
