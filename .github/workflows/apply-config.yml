name: Apply config (dev)

# Re-reads the OCI Vault secret and recreates app services without changing
# image tags or running migrations. This is a Vault-only operation; it does
# not reconcile application or deployment source revisions. Edit the secret
# first, then leave `secret_version` empty for CURRENT or choose a version.
on:
  workflow_dispatch:
    inputs:
      secret_version:
        description: OCI secret version number to apply (empty = current)
        required: false
        type: string

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: languee-dev
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark applied state untrusted before Vault mutation
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            if ! python3 /opt/languee/scripts/deploy-state.py --help | grep -q 'finish-vault'; then
              echo "the host deployment-state helper is outdated; run Deploy (dev) before Apply config (dev)" >&2
              exit 1
            fi
            python3 /opt/languee/scripts/deploy-state.py begin --app-dir /opt/languee

      - name: Apply Vault config
        uses: appleboy/ssh-action@v1.2.5
        env:
          SECRET_VERSION: ${{ inputs.secret_version }}
          VAULT_SECRET_OCID: ${{ vars.VAULT_SECRET_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SECRET_VERSION,VAULT_SECRET_OCID,OCI_REGION
          script: |
            set -euo pipefail
            args=(--preserve-tags)
            if [ -n "$SECRET_VERSION" ]; then args+=(--secret-version "$SECRET_VERSION"); fi
            /opt/languee/scripts/deploy-stack.sh "${args[@]}"

      - name: Check public backend readiness
        env:
          DEPLOY_HEALTHCHECK_URL: ${{ vars.DEPLOY_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HEALTHCHECK_URL" ]; then
            echo "DEPLOY_HEALTHCHECK_URL must be the public /health/ready URL" >&2
            exit 1
          fi
          case "$DEPLOY_HEALTHCHECK_URL" in
            https://*/health/ready) ;;
            *)
              echo "DEPLOY_HEALTHCHECK_URL must be an HTTPS URL ending in /health/ready" >&2
              exit 1
              ;;
          esac
          curl --fail --show-error --silent --max-time 15 --retry 10 --retry-delay 6 \
            --retry-all-errors "$DEPLOY_HEALTHCHECK_URL" > /dev/null

      - name: Preserve previously verified source state
        id: applied
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          capture_stdout: true
          script: |
            set -euo pipefail
            python3 /opt/languee/scripts/deploy-state.py finish-vault --app-dir /opt/languee

      - name: Report code reconciliation separately from Vault apply
        env:
          APPLIED_STATE_JSON: ${{ steps.applied.outputs.stdout }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin develop
          head=$(git rev-parse origin/develop)
          decision=$(printf '%s\n' "$APPLIED_STATE_JSON" | python3 deploy/scripts/reconcile-deploy.py --ref "$head" --head "$head")
          printf '%s\n' "$decision"
          {
            echo '## Apply config (dev)'
            echo
            echo 'The Vault-backed environment update and public readiness check completed. When the source state was trusted before this run, it was preserved without advancing any applied source revision. This workflow does not build or deploy application code, deployment scripts, or tracked Compose configuration.'
            echo
            if [ "$(jq -r .state_known <<<"$decision")" != true ]; then
              echo '**Source state is unknown.** Run Deploy (dev) to rebuild and verify both application services.'
            elif [ "$(jq -r .backend <<<"$decision")" = true ] || [ "$(jq -r .nlp <<<"$decision")" = true ] || [ "$(jq -r .config <<<"$decision")" = true ]; then
              echo '**Source reconciliation is still required.** Run Deploy (dev) on the current develop head; this successful Vault-only run does not mean the application stack is current.'
            else
              echo 'The applied source revisions match current develop at the time of this check. This workflow still applied Vault configuration only.'
            fi
            echo
            echo '| Component | Desired source revision | Last verified source revision |'
            echo '| --- | --- | --- |'
            printf '| Backend | %s | %s |\n' "$(jq -r .desired.backend <<<"$decision")" "$(jq -r .applied.backend <<<"$decision")"
            printf '| NLP | %s | %s |\n' "$(jq -r .desired.nlp <<<"$decision")" "$(jq -r .applied.nlp <<<"$decision")"
            printf '| Configuration | %s | %s |\n' "$(jq -r .desired.configuration <<<"$decision")" "$(jq -r .applied.configuration <<<"$decision")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain interrupted Vault apply
        if: failure()
        run: |
          {
            echo '## Apply config (dev) did not complete verification'
            echo
            echo 'Applied source state was marked untrusted before the Vault update. A failed update, readiness check, or state-preservation step leaves it unknown so the next Deploy (dev) run reconciles both application services and tracked configuration.'
          } >> "$GITHUB_STEP_SUMMARY"
