name: Android development distribution

on:
  push:
    branches: [develop]
    paths:
      - apps/languee-droid/**
      - .github/workflows/android-distribute.yml
  workflow_dispatch:

concurrency:
  group: android-distribute-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.stale.outputs.stale }}
    steps:
      - name: Require develop
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/develop ]; then
            echo "Android distribution can only run from develop, not $GITHUB_REF" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - id: stale
        name: Detect stale source revision
        run: |
          set -euo pipefail
          git fetch origin develop
          head=$(git rev-parse origin/develop)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA is no longer the develop head; skipping distribution"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

  distribute:
    needs: validate-source
    if: needs.validate-source.outputs.stale != 'true'
    runs-on: ubuntu-latest
    environment: languee-dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configure Android build inputs
        working-directory: apps/languee-droid
        env:
          BACKEND_URL: ${{ vars.LANGUEE_BACKEND_BASE_URL }}
          OTEL_ENDPOINT: ${{ vars.OTEL_EXPORTER_ENDPOINT }}
          TELEMETRY_USERNAME: ${{ vars.TELEMETRY_USERNAME }}
          TELEMETRY_PASSWORD: ${{ secrets.TELEMETRY_PASSWORD }}
        run: |
          set -euo pipefail
          if ! [[ "$BACKEND_URL" =~ ^https://[^/[:space:]]+(/.*)?$ ]]; then
            echo "LANGUEE_BACKEND_BASE_URL must be a nonempty HTTPS URL" >&2
            exit 1
          fi
          if ! [[ "$OTEL_ENDPOINT" =~ ^https://[^/[:space:]]+$ ]]; then
            echo "OTEL_EXPORTER_ENDPOINT must be a nonempty HTTPS base URL" >&2
            exit 1
          fi
          if [ -z "$TELEMETRY_USERNAME" ] || [ -z "$TELEMETRY_PASSWORD" ]; then
            echo "TELEMETRY_USERNAME and TELEMETRY_PASSWORD must be configured" >&2
            exit 1
          fi
          umask 077
          printf 'sdk.dir=%s\nLANGUEE_BACKEND_BASE_URL=%s\nOTEL_EXPORTER_ENDPOINT=%s\nTELEMETRY_USERNAME=%s\nTELEMETRY_PASSWORD=%s\n' "$ANDROID_HOME" "$BACKEND_URL" "$OTEL_ENDPOINT" "$TELEMETRY_USERNAME" "$TELEMETRY_PASSWORD" > local.properties

      - name: Derive development build version
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" -ge 1000 ]; then
            echo "github.run_attempt must be less than 1000" >&2
            exit 1
          fi
          ordinal=$((GITHUB_RUN_NUMBER * 1000 + GITHUB_RUN_ATTEMPT))
          if [ "$ordinal" -lt 1 ] || [ "$ordinal" -gt 2100000000 ]; then
            echo "Android versionCode must be between 1 and 2100000000" >&2
            exit 1
          fi
          echo "ANDROID_BUILD_ORDINAL=$ordinal" >> "$GITHUB_ENV"

      - name: Restore the development signing keystore
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$keystore_path")"
          rm -f "$keystore_path"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          keytool -list -keystore "$keystore_path" -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        working-directory: apps/languee-droid
        env:
          GIT_SHA: ${{ github.sha }}
        run: ./gradlew assembleDebug

      - name: Verify APK metadata and signature
        env:
          EXPECTED_ORDINAL: ${{ env.ANDROID_BUILD_ORDINAL }}
        run: |
          set -euo pipefail
          apk=apps/languee-droid/app/build/outputs/apk/debug/app-debug.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          if [ -z "$aapt" ]; then
            echo "Android SDK aapt was not found" >&2
            exit 1
          fi
          "$aapt" dump badging "$apk" | tee apk-badging.txt
          grep -F "package: name='com.languee.droid' versionCode='$EXPECTED_ORDINAL' versionName='0.0.$EXPECTED_ORDINAL'" apk-badging.txt
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo "Android SDK apksigner was not found" >&2
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk"
          rm -f apk-badging.txt

      - id: current-head
        name: Confirm source is still current
        run: |
          set -euo pipefail
          git fetch origin develop
          head=$(git rev-parse origin/develop)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA is no longer the develop head; skipping distribution"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Firebase App Distribution
        if: steps.current-head.outputs.stale != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EXPECTED_ORDINAL: ${{ env.ANDROID_BUILD_ORDINAL }}
        run: |
          set -euo pipefail
          credentials_file="$RUNNER_TEMP/firebase-service-account.json"
          trap 'rm -f "$credentials_file"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials_file"
          chmod 600 "$credentials_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials_file"
          npm install --global firebase-tools@14.10.1
          firebase appdistribution:distribute apps/languee-droid/app/build/outputs/apk/debug/app-debug.apk \
            --app 1:1030698886805:android:bc7a09eaa03b5fa082dd9c \
            --groups internal \
            --release-notes "Languee 0.0.$EXPECTED_ORDINAL (${GITHUB_SHA:0:12}) — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Remove signing material
        if: always()
        run: rm -f "$HOME/.android/debug.keystore" "$RUNNER_TEMP/firebase-service-account.json" apps/languee-droid/local.properties
