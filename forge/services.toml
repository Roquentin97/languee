[services.languee-back]
path = "apps/languee-back"
runtime = "node"
framework = "nestjs"
package_manager = "yarn"
persistence = "prisma"
dev_port = 3000
affected_components = ["auth", "users"]
rulesets = ["common", "boundary", "nestjs", "prisma", "jest"]
environment = [
  "DATABASE_URL",
  "JWT_SECRET",
  "REDIS_URL",
  "LANGUEE_BACK_API_PORT",
]

[services.languee-back.commands]
install = "yarn install --frozen-lockfile"
format = "yarn format"
lint = "yarn lint"
test = "yarn test"
coverage = "yarn test:cov"
build = "yarn build"
validate_persistence = "yarn prisma validate"
persistence_migrate = "sh scripts/load-env.sh yarn prisma migrate dev --name <feature-name>"
persistence_generate = "sh scripts/load-env.sh yarn prisma generate"

[services.languee-back.context]
include = ["src/**/*.ts", "test/**/*.ts", "prisma/schema.prisma", "package.json"]
exclude = ["node_modules/**", "dist/**", "build/**", "coverage/**"]
always_full = ["prisma/schema.prisma", "package.json"]

[services.languee-nlp]
path = "apps/languee-nlp"
runtime = "python"
framework = "fastapi"
package_manager = "uv"
persistence = ""
dev_port = 8000
affected_components = ["api", "nlp", "spacy"]
rulesets = ["common", "boundary", "fastapi", "spacy", "pytest"]
environment = [
  "LANGUEE_NLP_PORT",
  "LANGUEE_NLP_SPACY_MODEL",
]

[services.languee-nlp.commands]
install = "uv sync"
format = "uv run ruff format ."
lint = "uv run ruff check ."
test = "uv run pytest"
coverage = "uv run pytest --cov=languee_nlp"

[services.languee-nlp.context]
include = ["src/**/*.py", "tests/**/*.py", "pyproject.toml"]
exclude = [
  ".venv/**",
  "__pycache__/**",
  ".pytest_cache/**",
  ".ruff_cache/**",
  "dist/**",
  "build/**",
  "coverage/**",
]
always_full = ["pyproject.toml"]
