# Production stack for a single small VPS (Hetzner x86 or Oracle ARM — images
# are multi-arch). Designed to run from /opt/languee on the server, where the
# deploy workflow places this file together with caddy/Caddyfile and
# scripts/backup-db.sh. Interpolation values come from /opt/languee/.env
# (see deploy/env/stack.env.example); service env comes from languee-back.env /
# languee-nlp.env.
#
# Service names match the app directories and image names (languee-back,
# languee-nlp) so one vocabulary covers compose, images, Forge targets, commit
# scopes, and the SERVICE_NAME each app reports in logs and traces.
#
# Observability is intentionally absent: apps ship OTLP directly to Grafana
# Cloud when enabled in languee-back.env / languee-nlp.env. Postgres, Redis, and
# the NLP service publish no host ports — only Caddy is reachable from outside.

name: languee

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      languee-back:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANGUEE_BACK_POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${LANGUEE_BACK_POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${LANGUEE_BACK_POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${LANGUEE_BACK_POSTGRES_USER} -d ${LANGUEE_BACK_POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${LANGUEE_BACK_REDIS_PASSWORD:?}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGUEE_BACK_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  languee-nlp:
    image: ghcr.io/roquentin97/languee/languee-nlp:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./languee-nlp.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5).read()\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  languee-back:
    image: ghcr.io/roquentin97/languee/languee-back:${TAG:-latest}
    restart: unless-stopped
    env_file:
      - ./languee-back.env
    # Derived from the stack vars in /opt/languee/.env so Postgres and Redis
    # credentials are declared in exactly one place. `environment` wins over
    # `env_file`, so these are authoritative.
    environment:
      DATABASE_URL: postgresql://${LANGUEE_BACK_POSTGRES_USER}:${LANGUEE_BACK_POSTGRES_PASSWORD}@postgres:5432/${LANGUEE_BACK_POSTGRES_DB}
      REDIS_PASSWORD: ${LANGUEE_BACK_REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      languee-nlp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  migrate:
    image: ghcr.io/roquentin97/languee/languee-back-migrator:${TAG:-latest}
    profiles:
      - tools
    env_file:
      - ./languee-back.env
    environment:
      DATABASE_URL: postgresql://${LANGUEE_BACK_POSTGRES_USER}:${LANGUEE_BACK_POSTGRES_PASSWORD}@postgres:5432/${LANGUEE_BACK_POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
