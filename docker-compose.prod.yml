# Production stack for a single small VPS (Oracle ARM — images are
# linux/arm64 only). Designed to run from /opt/languee on the server, where the
# deploy workflow places this file together with caddy/Caddyfile and
# scripts/backup-db.sh. Interpolation values come from /opt/languee/.env
# (see deploy/env/stack.env.example); service env comes from languee-back.env /
# languee-nlp.env.
#
# Service names match the app directories and image names (languee-back,
# languee-nlp) so one vocabulary covers compose, images, Forge targets, commit
# scopes, and the SERVICE_NAME each app reports in logs and traces.
#
# Caddy is the only service with published ports. Observability data remains on
# the Compose network except the protected OTLP/HTTP ingress on TELEMETRY_DOMAIN.

name: languee

services:
  caddy:
    image: caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      MONITOR_DOMAIN: ${MONITOR_DOMAIN:?MONITOR_DOMAIN is required}
      TELEMETRY_DOMAIN: ${TELEMETRY_DOMAIN:?TELEMETRY_DOMAIN is required}
      TELEMETRY_USERNAME: ${TELEMETRY_USERNAME:?TELEMETRY_USERNAME is required}
      TELEMETRY_PASSWORD_HASH: ${TELEMETRY_PASSWORD_HASH:?TELEMETRY_PASSWORD_HASH is required}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      languee-back:
        condition: service_healthy
    labels:
      logging: alloy
      service: caddy
      app: proxy
      environment: production

  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANGUEE_BACK_POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${LANGUEE_BACK_POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${LANGUEE_BACK_POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${LANGUEE_BACK_POSTGRES_USER} -d ${LANGUEE_BACK_POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    command: redis-server --requirepass ${LANGUEE_BACK_REDIS_PASSWORD:?}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGUEE_BACK_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  languee-nlp:
    image: ghcr.io/roquentin97/languee/languee-nlp:${LANGUEE_NLP_TAG:?LANGUEE_NLP_TAG is required}
    restart: unless-stopped
    env_file:
      - ./languee-nlp.env
    labels:
      logging: alloy
      service: languee-nlp
      app: backend
      environment: production
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5).read()\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  languee-back:
    image: ghcr.io/roquentin97/languee/languee-back:${LANGUEE_BACK_TAG:?LANGUEE_BACK_TAG is required}
    restart: unless-stopped
    env_file:
      - ./languee-back.env
    # Derived from the stack vars in /opt/languee/.env so Postgres and Redis
    # credentials are declared in exactly one place. `environment` wins over
    # `env_file`, so these are authoritative.
    environment:
      DATABASE_URL: postgresql://${LANGUEE_BACK_POSTGRES_USER}:${LANGUEE_BACK_POSTGRES_PASSWORD}@postgres:5432/${LANGUEE_BACK_POSTGRES_DB}
      REDIS_PASSWORD: ${LANGUEE_BACK_REDIS_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      languee-nlp:
        condition: service_healthy
    healthcheck:
      # Liveness deliberately avoids dependency checks: a transient dependency
      # outage must not make Docker restart a healthy backend process.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      logging: alloy
      service: languee-back
      app: backend
      environment: production

  migrate:
    image: ghcr.io/roquentin97/languee/languee-back-migrator:${LANGUEE_BACK_TAG:?LANGUEE_BACK_TAG is required}
    profiles:
      - tools
    env_file:
      - ./languee-back.env
    environment:
      DATABASE_URL: postgresql://${LANGUEE_BACK_POSTGRES_USER}:${LANGUEE_BACK_POSTGRES_PASSWORD}@postgres:5432/${LANGUEE_BACK_POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  loki:
    image: grafana/loki:3.7.2@sha256:191d4fdfb7264f16989f0a57f320872620a5a7c2ceeec6229212c4190ec49b86
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    volumes:
      - ./provision/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  tempo:
    image: grafana/tempo:2.7.1@sha256:4443be217c396b065ee34845534199c36fdba4dc619cb96550e228d73fba6e69
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    restart: unless-stopped
    volumes:
      - ./provision/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.4.0@sha256:78ed1f9050eb9eaf766af6e580230b1c4965728650e332cd1ee918c0c4699775
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --storage.tsdb.retention.time=30d
    restart: unless-stopped
    volumes:
      - ./provision/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  alloy:
    image: grafana/alloy:v1.16.0@sha256:6e00cf7c5a692ff5f24844529416ed017d76fce922f8199004e73d5eca46b6b8
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    restart: unless-stopped
    volumes:
      - ./provision/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    mem_limit: 256m
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.0.1-security-01@sha256:2d1f9ae67c1778d33e291d4c3c759cd8b650e67491f02533499eb950e075eeb5
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./provision/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provision/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    mem_limit: 256m
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  loki_data:
  tempo_data:
  alloy_data:
  grafana_data:
  prometheus_data:
